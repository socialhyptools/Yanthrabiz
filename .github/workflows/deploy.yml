name: Build & Deploy to Hostinger

# Trigger on every push to this branch
on:
  push:
    branches:
      - feature/v1.0_InitialDevelopment

jobs:
  build-and-deploy:
    name: Build Next.js → Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (match version used locally)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install dependencies (clean install for CI)
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js static export → generates /out folder
      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production

      # 5. Copy .htaccess into the out/ folder so it is deployed
      - name: Copy .htaccess to out/
        run: cp public/.htaccess out/.htaccess

      # 6. Deploy out/ → Hostinger public_html/ via FTP
      #    Uses GitHub Secrets for credentials (never hardcode!)
      #    dangerous-clean-slate is OFF so the /blog WordPress folder
      #    on the server is NEVER deleted during deployment.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/**
