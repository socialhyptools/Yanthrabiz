name: Build & Deploy to Hostinger

# Trigger on every push to this branch
on:
  push:
    branches:
      - feature/v1.0_InitialDevelopment

jobs:
  build-and-deploy:
    name: Build Next.js → Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 3. Install dependencies (clean install for CI)
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js static export → generates /out folder
      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production

      # 5. Copy .htaccess into the out/ folder so it is deployed
      - name: Copy .htaccess to out/
        run: cp public/.htaccess out/.htaccess

      # 6. Deploy out/ → Hostinger public_html/ via SFTP
      #    Hostinger Cloud hosting uses SFTP (port 22), not plain FTP
      #    --exclude blog/ ensures the WordPress /blog directory is NEVER deleted
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to Hostinger via SFTP
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:reconnect-interval-base 5
            open sftp://$SFTP_USER:$SFTP_PASS@$SFTP_SERVER:22
            mirror -R --verbose --no-perms --ignore-time --exclude=blog/ ./out/ /public_html/
            bye
          "
